; ATTENZIONE: valori di esempio. Cambia utente/password prima di qualsiasi
; uso reale: quelli qui sotto sono solo placeholder per l'installazione.
[database]
database.driver = "mysql"
database.host = "127.0.0.1"
database.port = ""
database.user = "krisoft"
database.password = "krisoft"
database.name = "kiwi"

[framework]
framework.theme = "default"
framework.theme_admin = "default"
framework.title_page = "MyKrisoft"
framework.title_application = "K-iwi"
framework.author = "Krisoft s.r.l."
framework.copyright = "Copyright Krisoft s.r.l. this software is under the GPL V3.0"
framework.meta_description = "Framework to build Business Software"

[setting]
setting.use_ssl = "1"
setting.use_session_db = "1"
setting.error_display = "0"
setting.error_log = "1"
setting.file_log = "error.txt"
setting.compression = "0"
; lingua di default (CODE di krs_languages): vale per chi non e' loggato, per
; chi non ha scelto una lingua e come riserva per i testi che la lingua
; dell'utente non ha. La lingua del browser non viene usata.
setting.language = "en_GB"
setting.timeout = 1800
setting.decimals = 3
setting.dec_point = ","
setting.thousands_sep = "."

[report]
report.time_expire = 120
report.base_url = "http://localhost:8080/birt"
